<h1>Responsive Typography</h1>
<h2>Text size changes with the screen</h2>
<p>On a phone the text is small, on a tablet it is medium and on a desktop it is large. This is done with media queries.</p>
<h2>Why it is useful</h2>
<p>Text should be easy to read on every device, so the font size has to depend on the width of the screen.</p>
